name: Ofertas (Promociones Aéreas)
# Cada 3 horas lee las publicaciones nuevas de Promociones Aéreas y actualiza data/ofertas.json.
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/ofertas.mjs", ".github/workflows/ofertas.yml"]
permissions:
  contents: write
concurrency: { group: ofertas, cancel-in-progress: false }
jobs:
  ofertas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/ofertas.mjs
      - run: |
          git config user.name "robot-ofertas"
          git config user.email "actions@users.noreply.github.com"
          git add data/ofertas.json
          git diff --cached --quiet && exit 0
          git commit -m "Ofertas: publicaciones nuevas [skip ci]"
          git pull --rebase -q && git push
