name: Prueba completa (app publicada)
# Abre la app publicada en un navegador real y prueba los recorridos principales. Corre solo a mano.
# Deja capturas y resultado.json en la rama "pruebas".
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: prueba, cancel-in-progress: true }
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          npm init -y >/dev/null
          npm i playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - run: node tools/prueba-completa.mjs
      - if: always()
        run: |
          git config user.name "robot-prueba"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan pruebas
          git rm -rq --cached . 
          git add -f prueba
          git commit -qm "Resultado de la prueba completa [skip ci]"
          git push -qf origin pruebas
