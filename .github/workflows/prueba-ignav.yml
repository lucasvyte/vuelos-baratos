name: Prueba Ignav (un solo uso)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/prueba-ignav.mjs"]
permissions:
  contents: write
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/prueba-ignav.mjs
      - run: |
          git config user.name "robot-prueba"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b prueba-ignav
          git add -f prueba-ignav.json
          git commit -m "Resultado de la prueba de Ignav [skip ci]"
          git push -f origin prueba-ignav
