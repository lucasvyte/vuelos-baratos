name: Servidor intermedio (publicar en Cloudflare)
# Publica worker/ignav.js en Cloudflare cada vez que cambia en main (o a mano desde Actions → Run workflow).
# Necesita dos secretos del repo: CLOUDFLARE_API_TOKEN (permiso "Edit Cloudflare Workers") y
# CLOUDFLARE_ACCOUNT_ID. Sin los secretos, no hace nada. La clave de Ignav sigue guardada en Cloudflare.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/servidor.yml"]
permissions:
  contents: read
concurrency: { group: servidor, cancel-in-progress: false }
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Faltan los secretos
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::Faltan CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID; el servidor no se publicó."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with: { node-version: 22 }
      - name: Publicar
        if: env.HAS_TOKEN == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          # del ID se toma solo el código de 32 caracteres (por si se copió con barras, espacios o la dirección entera)
          ACC=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -oiE '[0-9a-f]{32}' | head -n1)
          if [ -z "$ACC" ]; then echo "::error title=No se pudo publicar::El secreto CLOUDFLARE_ACCOUNT_ID no tiene un ID de cuenta válido (32 letras y números)."; exit 1; fi
          export CLOUDFLARE_ACCOUNT_ID="$ACC"
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          npx --yes wrangler@4 deploy > ../deploy.log 2>&1
          code=$?
          cat ../deploy.log
          if [ $code -ne 0 ]; then
            # deja el motivo como aviso visible (sin datos secretos: wrangler no imprime el token)
            msg=$(grep -v "^\s*$" ../deploy.log | tail -25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=No se pudo publicar::$msg"
          fi
          exit $code
      - name: Probar
        if: env.HAS_TOKEN == 'true'
        run: |
          r=$(curl -fsS https://vuelos-baratos-api.978-llv.workers.dev/)
          echo "$r"
          echo "$r" | grep -q '"clave":"cargada"' || { echo "::error title=Falta la clave::El servidor está publicado pero no tiene IGNAV_KEY."; exit 1; }
          echo "::notice title=Servidor publicado::La clave de Ignav está cargada."
